name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ] # Kodları hangi dala gönderdiğinizde çalışacağını belirtir
  workflow_dispatch: # GitHub panelinden manuel olarak "Run workflow" diyerek de tetikleyebilirsiniz

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # Projenizin kullandığı Flutter sürümüne göre güncelleyebilirsiniz
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk