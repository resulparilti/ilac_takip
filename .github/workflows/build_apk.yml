name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Create .env for asset bundling
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: |
          set -o pipefail
          flutter build apk --release --stacktrace 2>&1 | tee build_log.txt
        continue-on-error: false

      - name: Show Gradle failure excerpt
        if: failure()
        run: |
          echo "===== FAILURE EXCERPT ====="
          grep -n -E "FAILURE:|What went wrong|error:|Error:|Caused by:|R8|minify|NDK|AAPT|Execution failed" build_log.txt | tail -n 80 || true
          echo "===== LAST 80 LINES ====="
          tail -n 80 build_log.txt || true

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          if-no-files-found: ignore
