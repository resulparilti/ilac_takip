name: ilac_takip
description: Yaşlı kullanıcılar için ilaç ve su takip uygulaması (Free/Premium).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_dotenv: ^5.2.1
  google_fonts: ^6.2.1
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6
  intl: ^0.20.3
  permission_handler: ^13.0.0
  google_mobile_ads: ^9.0.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  in_app_purchase: ^3.3.0
  sqflite_common_ffi_web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
